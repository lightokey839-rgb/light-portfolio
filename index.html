<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0b0f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8f6f2" media="(prefers-color-scheme: light)" />
    <meta name="description" content="LIGHT — Web3 Developer &amp; Builder. I build websites, Telegram bots &amp; Mini Apps for Web3 projects." />
    <title>LIGHT — Web3 Developer &amp; Builder</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!--
      Runs before first paint so the correct theme is applied immediately —
      no flash of the wrong theme while React hydrates. Reads the same
      localStorage key ThemeContext uses, and falls back to the OS
      preference only when the visitor hasn't chosen one yet.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("light-portfolio-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
